<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Obsid-finance — consolidated, explainable financial intelligence for individuals and businesses. Evidence on every number, approval before every action.">
  <meta name="theme-color" content="#0B0B0C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Obsid-finance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Obsid-finance — Your money, finally explained</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0C; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .5s ease; }
    #boot .mark { width: 34px; height: 34px; border: 1px solid #E5E4E2; transform: rotate(45deg); display: grid; place-items: center; animation: pulse 1.6s ease-in-out infinite; }
    #boot .mark::after { content: ""; width: 12px; height: 12px; background: #E8D8B0; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot"><div class="mark"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 600); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
